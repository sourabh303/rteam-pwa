<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RTeam Hub</title>

<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e56ce">
<link rel="manifest" href="manifest.json">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;background:#f8fafc;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
.header{
  background:#1e56ce;color:white;
  padding:max(1rem,env(safe-area-inset-top)) 1.2rem 1rem;
  display:flex;justify-content:space-between;align-items:center
}
.brand{display:flex;gap:.75rem;font-weight:900;font-size:1.25rem}
.logo{
  width:2.25rem;height:2.25rem;background:white;color:#1e56ce;
  border-radius:.5rem;display:flex;align-items:center;justify-content:center
}

/* STATUS */
.status-badge{
  font-size:10px;font-weight:700;padding:.25rem .75rem;border-radius:9999px
}
.status-ready{background:#22c55e;color:white}
.status-syncing{background:#eab308;color:white}

/* SCANNER */
.scanner-wrapper{
  flex:1;background:black;display:flex;align-items:center;justify-content:center
}
#reader{width:100%!important;height:100%!important}
#reader video{
  width:100%!important;height:100%!important;
  object-fit:cover!important
}

/* FOOTER */
footer{
  background:white;padding:1.25rem 1.5rem calc(1rem + env(safe-area-inset-bottom));
  text-align:center;border-top:1px solid #e2e8f0
}

/* BUTTONS */
.install-btn,
.camera-btn{
  width:100%;
  padding:.85rem;
  border:none;
  border-radius:14px;
  font-weight:800;
  margin-bottom:.75rem;
}
.install-btn{
  background:#2563eb;
  color:white;
  display:none;
}
.camera-btn{
  background:#0f172a;
  color:white;
}

/* Hide install button inside PWA */
@media (display-mode: standalone){
  .install-btn{display:none!important}
}

/* TOAST */
.toast{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:white;padding:2rem;border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
  z-index:9999;text-align:center;width:80%
}
</style>
</head>

<body>

<audio id="soundSuccess" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="soundError" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<header class="header">
  <div class="brand"><div class="logo">RT</div>RTeam Hub</div>
  <div id="statusText" class="status-badge status-ready">Ready</div>
</header>

<main class="scanner-wrapper">
  <div id="reader"></div>
</main>

<footer>
  <button id="installBtn" class="install-btn">Install App</button>
  <button id="cameraBtn" class="camera-btn">Switch Camera</button>
  <h3>Attendance Scanner</h3>
  <p style="font-size:.75rem;color:#94a3b8">Center QR in frame</p>
</footer>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzeKiMJm15lvl8ptu7kYHqoMQCdEKGgY1n1McoubRgpkzlp5ZLbTWm4wGxGmUqQWGnm/exec";

let isScanning = false;
let deferredPrompt;

let scanner = null;
let availableCameras = [];
let currentCameraIndex = 0;

/* DEVICE UUID */
function getUUID(){
  let id = localStorage.getItem("device_uuid");
  if(!id){
    id = crypto.randomUUID();
    localStorage.setItem("device_uuid", id);
  }
  return id;
}

/* INSTALL BUTTON LOGIC */
const installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", (e)=>{
  if (window.matchMedia("(display-mode: standalone)").matches) return;
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});

/* UI */
function setStatus(state){
  const el = document.getElementById("statusText");
  const syncing = state === "syncing";
  el.textContent = syncing ? "Syncing" : "Ready";
  el.className = "status-badge " + (syncing ? "status-syncing" : "status-ready");
}

function toast(icon,title,msg,ok){
  document.getElementById(ok ? "soundSuccess" : "soundError").play().catch(()=>{});
  const t=document.createElement("div");
  t.className="toast";
  t.innerHTML=`<div style="font-size:3rem">${icon}</div><b>${title}</b><div>${msg}</div>`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

/* Accept JSON QR or plain-text employee ID */
function parseQrPayload(txt){
  try{
    const d = JSON.parse(txt);
    const workerId = (d.id ?? d.workerId ?? "").toString().trim();
    return {
      workerId,
      workerName: (d.name ?? d.workerName ?? "").toString(),
      department: (d.dept ?? d.department ?? "").toString()
    };
  }catch{
    return {
      workerId: txt.toString().trim(),
      workerName: "",
      department: ""
    };
  }
}

/* SCAN */
async function onScanSuccess(txt){
  if(isScanning) return;
  isScanning = true;
  setStatus("syncing");

  try{
    const parsed = parseQrPayload(txt);
    if (!parsed.workerId) throw new Error("Empty worker ID");

    await fetch(GAS_URL,{
      method:"POST",
      mode:"no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        workerId: parsed.workerId,
        workerName: parsed.workerName,
        department: parsed.department,
        deviceUUID: getUUID()
      })
    });

    toast("✅","Recorded",parsed.workerId,true);
  }catch(err){
    console.error("Scan/Sync error:", err);
    toast("⚠️","Sync failed","Invalid QR or network issue",false);
  }finally{
    setTimeout(()=>{
      isScanning=false;
      setStatus("ready");
    },1500);
  }
}

/* CAMERA CONTROL */
const cameraBtn = document.getElementById("cameraBtn");

async function startScannerWithCamera(cameraConfig){
  await scanner.start(
    cameraConfig,
    { fps: 10, qrbox: { width: 260, height: 260 } },
    onScanSuccess
  );
}

async function initScanner(){
  scanner = new Html5Qrcode("reader");

  try{
    availableCameras = await Html5Qrcode.getCameras();
  }catch(err){
    console.error("Camera list error:", err);
    availableCameras = [];
  }

  if (availableCameras.length > 0) {
    const rearIdx = availableCameras.findIndex(c =>
      /back|rear|environment/i.test(c.label || "")
    );
    currentCameraIndex = rearIdx >= 0 ? rearIdx : 0;
    await startScannerWithCamera({ deviceId: { exact: availableCameras[currentCameraIndex].id } });
    cameraBtn.style.display = availableCameras.length > 1 ? "block" : "none";
    return;
  }

  // fallback (if labels/deviceIds not available yet)
  try{
    await startScannerWithCamera({ facingMode: { exact: "environment" } });
  }catch{
    await startScannerWithCamera({ facingMode: "user" });
  }
  cameraBtn.style.display = "none";
}

cameraBtn.addEventListener("click", async ()=>{
  if (!scanner || availableCameras.length < 2) return;

  try{
    setStatus("syncing");
    cameraBtn.disabled = true;

    await scanner.stop();
    currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;

    await startScannerWithCamera({
      deviceId: { exact: availableCameras[currentCameraIndex].id }
    });

    toast("📷","Camera switched",availableCameras[currentCameraIndex].label || "Camera changed",true);
  }catch(err){
    console.error("Camera switch error:", err);
    toast("⚠️","Camera error","Could not switch camera",false);
  }finally{
    cameraBtn.disabled = false;
    setStatus("ready");
  }
});

/* START */
window.onload = async ()=>{
  try{
    await initScanner();
  }catch(err){
    console.error("Scanner init failed:", err);
    toast("⚠️","Scanner failed","Camera permission/device issue",false);
  }
};
</script>

</body>
</html>
